services:
  - type: web
    name: webar-restaurant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

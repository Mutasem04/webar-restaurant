<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WebAR Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: white; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { font-size: 1.75rem; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 500; text-decoration: none; transition: all 0.3s; border: none; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #00d9ff, #00ff88); color: #1a1a2e; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; }
        .stat-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .stat-value { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #00d9ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { color: #a0aec0; font-size: 0.875rem; }
        .section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; }
        .section h2 { font-size: 1.25rem; margin-bottom: 1rem; }
        .user-info { display: flex; gap: 1rem; align-items: center; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #00d9ff, #00ff88); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="user-info">
                <div class="avatar">👤</div>
                <div>
                    <h1 id="greeting">Welcome back!</h1>
                    <p style="color:#a0aec0" id="businessName">Loading...</p>
                </div>
            </div>
            <div>
                <a href="/admin" class="btn btn-primary">📋 Manage Menu</a>
                <button class="btn btn-outline" onclick="logout()">🚪 Logout</button>
            </div>
        </header>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">🍽️</div><div class="stat-value" id="totalItems">0</div><div class="stat-label">Menu Items</div></div>
            <div class="stat-card"><div class="stat-icon">👁️</div><div class="stat-value" id="totalViews">0</div><div class="stat-label">Total Views</div></div>
            <div class="stat-card"><div class="stat-icon">📱</div><div class="stat-value" id="totalScans">0</div><div class="stat-label">QR Scans</div></div>
            <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value" id="plan">Free</div><div class="stat-label">Current Plan</div></div>
        </div>
        <div class="section">
            <h2>🚀 Quick Actions</h2>
            <p style="color:#a0aec0;margin-bottom:1rem;">Get started with your AR menu</p>
            <a href="/admin" class="btn btn-primary">➕ Add Menu Item</a>
            <a href="/pricing" class="btn btn-outline">💳 Upgrade Plan</a>
        </div>
    </div>
    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!localStorage.getItem('token')) window.location.href = '/login';
        document.getElementById('businessName').textContent = user.businessName || 'Your Restaurant';
        document.getElementById('greeting').textContent = `Welcome back, ${user.businessName || 'User'}!`;
        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '/login'; }
        fetch('/api/items').then(r => r.json()).then(items => { document.getElementById('totalItems').textContent = items.length || 0; }).catch(() => {});
    </script>
</body>
</html>

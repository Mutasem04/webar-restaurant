<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - WebAR Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f093fb, #f5576c); padding: 20px; }
        .auth-container { width: 100%; max-width: 420px; background: white; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); overflow: hidden; }
        .auth-header { background: linear-gradient(135deg, #f093fb, #f5576c); padding: 40px 30px; text-align: center; color: white; }
        .auth-header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .auth-body { padding: 40px 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #4a5568; font-weight: 500; }
        .form-group input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #f093fb; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #f093fb, #f5576c); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.3s; }
        .btn:hover { transform: translateY(-2px); }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .message.error { background: #fed7d7; color: #c53030; }
        .message.success { background: #c6f6d5; color: #276749; }
        .auth-footer { text-align: center; margin-top: 20px; }
        .auth-footer a { color: #f093fb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header"><h1>🔑 Reset Password</h1><p>Enter your email to reset your password</p></div>
        <div class="auth-body">
            <div id="message" class="message" style="display:none;"></div>
            <form id="resetForm">
                <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
                <button type="submit" class="btn">Send Reset Link</button>
            </form>
            <div class="auth-footer"><p><a href="/login">Back to Login</a></p></div>
        </div>
    </div>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const data = await res.json();
                msg.textContent = data.message || 'Reset link sent to your email';
                msg.className = 'message success';
                msg.style.display = 'block';
            } catch (err) { msg.textContent = 'Failed to send reset link'; msg.className = 'message error'; msg.style.display = 'block'; }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; text-align: center; padding: 2rem; }
        .error-container { max-width: 500px; }
        .error-code { font-size: 8rem; font-weight: 700; background: linear-gradient(135deg, #00d9ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .error-icon { font-size: 4rem; margin: 1rem 0; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #a0aec0; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 1rem 2rem; background: linear-gradient(135deg, #00d9ff, #00ff88); color: #1a1a2e; border-radius: 50px; font-weight: 600; text-decoration: none; transition: transform 0.3s; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-icon">🔍</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Go Home</a>
    </div>
</body>
</html>

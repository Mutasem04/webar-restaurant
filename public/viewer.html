<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Menu Viewer</title>
    
    <!-- MindAR with A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <link rel="stylesheet" href="/css/viewer.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="screen">
        <div class="loader">
            <div class="spinner"></div>
            <p id="loadingText">Initializing AR...</p>
        </div>
    </div>
    
    <!-- Error Screen -->
    <div id="errorScreen" class="screen hidden">
        <div class="error-content">
            <span class="error-icon">⚠️</span>
            <h2 id="errorTitle">Error</h2>
            <p id="errorMessage">Something went wrong</p>
            <button onclick="location.reload()" class="btn-retry">Try Again</button>
        </div>
    </div>
    
    <!-- Instructions Overlay -->
    <div id="instructionsOverlay" class="overlay hidden">
        <div class="instructions-content">
            <h3>How to View AR</h3>
            <div class="instruction-step">
                <span class="step-number">1</span>
                <p>Point your camera at the target image</p>
            </div>
            <div class="instruction-step">
                <span class="step-number">2</span>
                <p>Hold steady until AR content appears</p>
            </div>
            <div class="target-preview">
                <p>Target Image:</p>
                <img id="targetPreviewImg" src="" alt="Target">
            </div>
            <button onclick="hideInstructions()" class="btn-start">Got it!</button>
        </div>
    </div>
    
    <!-- AR Container -->
    <div id="arContainer" class="hidden">
        <!-- A-Frame scene will be injected here -->
    </div>
    
    <!-- UI Overlay -->
    <div id="uiOverlay" class="hidden">
        <div class="top-bar">
            <h1 id="itemName">Menu Item</h1>
            <p id="itemDescription"></p>
        </div>
        <div id="scanningIndicator" class="scanning-indicator">
            <div class="scan-animation"></div>
            <p>Point camera at target image</p>
        </div>
        <div class="bottom-bar">
            <button onclick="showInstructions()" class="btn-help">?</button>
        </div>
    </div>
    
    <!-- Fallback View (no camera) -->
    <div id="fallbackView" class="screen hidden">
        <div class="fallback-content">
            <h2 id="fallbackItemName">Menu Item</h2>
            <p id="fallbackDescription"></p>
            <div id="fallbackMedia"></div>
            <p class="fallback-note">Camera access required for full AR experience</p>
        </div>
    </div>
    
    <script src="/js/viewer.js"></script>
</body>
</html>
